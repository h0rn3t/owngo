name: "Free Windows disk space"
description: "Remove large preinstalled components from GitHub-hosted Windows images before LLVM/vcpkg/MSYS2 setup (ENOSPC guard)"
runs:
  using: "composite"
  steps:
    - name: Free disk space on Windows
      if: runner.os == 'Windows'
      shell: pwsh
      run: |
        $ErrorActionPreference = "Continue"

        function Show-Disk($label) {
          $drive = Get-PSDrive C | Select-Object -First 1
          $freeGB = [math]::Round($drive.Free / 1GB, 2)
          $usedGB = [math]::Round($drive.Used / 1GB, 2)
          Write-Host "disk[$label]: free=${freeGB}GB used=${usedGB}GB"
        }

        function Remove-Tree($path) {
          if ([string]::IsNullOrWhiteSpace($path)) {
            return
          }
          if (Test-Path $path) {
            Remove-Item -LiteralPath $path -Recurse -Force -ErrorAction SilentlyContinue
            if (Test-Path $path) {
              Write-Host "keep (in use): $path"
            } else {
              Write-Host "removed: $path"
            }
          }
        }

        Show-Disk "before"

        # Android SDK (~10-12GB). No workflow builds Android targets.
        Remove-Tree "C:\Android"
        Remove-Tree "C:\Program Files\Android"
        Remove-Tree "$env:ANDROID_HOME"
        Remove-Tree "$env:ANDROID_SDK_ROOT"

        # .NET SDKs (~5-7GB). No workflow builds or tests .NET code.
        Remove-Tree "C:\Program Files\dotnet"
        Remove-Tree "C:\Program Files (x86)\dotnet"

        # Haskell/GHC/cabal (~2GB). Unused by every workflow.
        Remove-Tree "C:\Program Files\Haskell"
        Remove-Tree "C:\ghcup"
        Remove-Tree "C:\cabal"

        # CodeQL bundle (~5GB). Checkout analysis never runs here.
        Remove-Tree "C:\hostedtoolcache\CodeQL"

        # Preinstalled language runtimes. setup-go/setup-python reinstall the
        # pinned versions on demand; the image's extra copies are pure weight.
        # Keep the tool-cache root itself: actions/cache restores llgo-* below it.
        Remove-Tree "C:\hostedtoolcache\go"
        Remove-Tree "C:\hostedtoolcache\Python"
        Remove-Tree "C:\hostedtoolcache\node"
        Remove-Tree "C:\hostedtoolcache\Ruby"
        Remove-Tree "C:\hostedtoolcache\PyPy"
        Remove-Tree "C:\hostedtoolcache\Java_Temurin-Hotspot_jdk"
        Remove-Tree "C:\hostedtoolcache\Java_Zulu_jdk"

        # Azure SDKs/CLI (~1GB). Qiniu runners are selected via labels, not Azure.
        Remove-Tree "C:\Program Files\Microsoft SDKs\Azure"
        Remove-Tree "C:\Program Files (x86)\Microsoft SDKs\Azure"
        Remove-Tree "C:\Program Files\Microsoft Azure CLI"

        # Stale package-manager caches. Toolchains are reinstalled by setup steps.
        Remove-Tree "$env:LOCALAPPDATA\npm-cache"
        Remove-Tree "$env:APPDATA\npm-cache"
        Remove-Tree "$env:LOCALAPPDATA\pip\Cache"
        Remove-Tree "C:\npm\cache"
        Remove-Tree "C:\ProgramData\chocolatey\lib-bkp"
        Remove-Tree "C:\ProgramData\chocolatey\lib-bad"

        # Docker images/layers from the base image. Windows jobs never use Docker
        # (Linux sysroot/release-container checks run on ubuntu runners).
        if (Get-Command docker -ErrorAction SilentlyContinue) {
          & docker system prune -af --volumes 2>$null
        }

        Show-Disk "after"
