name: OwnGo

# Перевірки моделі пам'яті owngo: Go-тести проходу й рантайму, програми
# прийняття owngo/* і GOROOT/test із тегом owngo. Upstream-перевірки llgo
# (embedded, wasm, релізи) у форку вимкнено; заміри швидкодії —
# owngo-binarytrees.yml.

on:
  push:
    branches:
      - main
  pull_request:
    branches: ["**"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: owngo.yml-${{ github.event_name }}-${{ github.event.pull_request.number || (github.event_name == 'push' && github.ref == 'refs/heads/main' && 'main') || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' || (github.event_name == 'push' && github.ref == 'refs/heads/main') }}

env:
  LLGO_ROOT: ${{ github.workspace }}

jobs:
  go-test:
    name: go test (owngo, census, pass, build)
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v7

      - name: Install dependencies
        uses: ./.github/actions/setup-deps
        with:
          llvm-version: 23

      - name: Set up Go
        uses: ./.github/actions/setup-go

      - name: Test owngo packages
        run: go test ./owngo/...

      - name: Host tests of the runtime
        working-directory: runtime
        run: go test ./internal/runtime/...

      - name: Test the owngo pass in cl
        run: go test -timeout 60m -run 'OwnGo' ./cl

      - name: Test owngo build orchestration
        run: go test -timeout 30m -run 'OwnGo|Owngo|ASan' ./internal/build

  fixtures:
    name: acceptance fixtures (owngo/*)
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v7

      - name: Install dependencies
        uses: ./.github/actions/setup-deps
        with:
          llvm-version: 23

      - name: Install the ASan runtime
        run: sudo apt-get install -y libclang-rt-23-dev

      - name: Set up Go
        uses: ./.github/actions/setup-go

      - name: Build llgo
        run: go build -o "$RUNNER_TEMP/llgo" ./cmd/llgo

      - name: Run fixtures
        run: owngo/fixtures.sh "$RUNNER_TEMP/llgo"

  goroot:
    name: GOROOT/test -tags owngo (shard ${{ matrix.shard }}/4)
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2, 3]
    steps:
      - uses: actions/checkout@v7

      - name: Install dependencies
        uses: ./.github/actions/setup-deps
        with:
          llvm-version: 23

      - name: Set up Go
        uses: ./.github/actions/setup-go

      - name: Build llgo
        run: go build -o "$RUNNER_TEMP/llgo" ./cmd/llgo

      # Базові xfail і host_skips llgo плюс випадки, що за задумом не
      # працюють без трасувального збирача (owngo/goroot-xfail.yaml).
      - name: Merge xfail lists
        run: |
          python3 - "$RUNNER_TEMP/xfail.yaml" <<'EOF'
          import sys, yaml
          base = yaml.safe_load(open("test/goroot/xfail.yaml"))
          extra = yaml.safe_load(open("owngo/goroot-xfail.yaml"))
          for key in ("xfails", "host_skips"):
              base[key] = (base.get(key) or []) + (extra.get(key) or [])
          yaml.safe_dump(base, open(sys.argv[1], "w"), sort_keys=False)
          EOF

      - name: Run GOROOT/test
        run: |
          go test ./test/goroot -run '^TestGoRootRunCases$' -count=1 -timeout 110m -v -args \
            -llgo "$RUNNER_TEMP/llgo" -goroot "$(go env GOROOT)" \
            -directive-mode ci -dirs .,fixedbugs \
            -llgo-flags=-tags=owngo \
            -xfail "$RUNNER_TEMP/xfail.yaml" \
            -shard-index ${{ matrix.shard }} -shard-total 4 \
            -min-swap-free-mib 0 -progress 5m
