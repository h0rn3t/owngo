name: Baseline benchmarks

on:
  push:
    branches:
      - main
  pull_request:
    branches: ["**"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: benchmark.yml-${{ github.event_name }}-${{ github.event.pull_request.number || (github.event_name == 'push' && github.ref == 'refs/heads/main' && 'main') || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' || (github.event_name == 'push' && github.ref == 'refs/heads/main') }}

jobs:
  prepare:
    uses: ./.github/workflows/ci-prepare.yml

  ci-gate:
    name: CI gate (Benchmark)
    needs: prepare
    if: always() && !cancelled()
    runs-on: ${{ fromJSON(needs.prepare.outputs.linux_runner || '["ubuntu-24.04"]') }}
    steps:
      - name: Verify CI preparation succeeded
        run: test "${{ needs.prepare.result }}" = "success"

  benchmark:
    if: needs.prepare.outputs.run_code_ci == 'true'
    needs: prepare
    name: benchmark (${{ matrix.display }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            id: linux
            display: Linux
            timeout: 20
          - os: macos-latest
            id: macos
            display: macOS
            timeout: 20
    runs-on: ${{ startsWith(matrix.os, 'ubuntu') && fromJSON(needs.prepare.outputs.linux_large_runner) || matrix.os }}
    timeout-minutes: ${{ matrix.timeout }}
    env:
      GOMAXPROCS: "2"
      LLGO_ROOT: ${{ github.workspace }}
      GOFLAGS: -tags=llvm23
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Read trusted pull request benchmark configuration
        if: github.event_name == 'pull_request'
        shell: bash
        env:
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_MERGE_BASE: ${{ needs.prepare.outputs.pr_merge_base }}
        run: |
          test -n "$PR_MERGE_BASE"
          mkdir -p .benchmark
          git show "$PR_BASE_SHA:.github/llgo-benchmark.yml" > .benchmark/base-benchmark.yml

      - name: Check out pull request base benchmark source
        if: github.event_name == 'pull_request'
        uses: actions/checkout@v7
        with:
          repository: ${{ github.event.pull_request.base.repo.full_name }}
          ref: ${{ needs.prepare.outputs.pr_merge_base }}
          path: .benchmark/base-source
          persist-credentials: false

      - name: Check out pull request head benchmark source
        if: github.event_name == 'pull_request'
        uses: actions/checkout@v7
        with:
          repository: ${{ github.event.pull_request.head.repo.full_name }}
          ref: ${{ needs.prepare.outputs.pr_head_sha }}
          path: .benchmark/head-source
          persist-credentials: false

      - name: Install dependencies
        uses: ./.github/actions/setup-deps
        with:
          llvm-version: 23

      - name: Install legacy macOS linker for the benchmark base
        if: github.event_name == 'pull_request' && runner.os == 'macOS' && runner.arch == 'ARM64'
        shell: bash
        run: |
          set -euo pipefail
          # The base compiler may still require #2828's external linker. Install
          # its dependency without changing PATH or the head compiler's tools.
          base="$GITHUB_WORKSPACE/.benchmark/base-source"
          if [[ -f "$base/internal/build/darwin_linker.go" ]]; then
            (
              LLGO_INSTALLER_LIBRARY_ONLY=1 source "$base/install.sh"
              install_macos_lld
            )
          fi

      - name: Set up Go
        uses: ./.github/actions/setup-go

      - name: Measure pull request base
        if: github.event_name == 'pull_request'
        id: measure-base
        shell: bash
        run: |
          benchmark/baseline/run.sh \
            .benchmark/base-source \
            .benchmark/base-llgo \
            .benchmark/base-results

      - name: Measure current revision
        shell: bash
        run: |
          source_root=.
          if [[ "$GITHUB_EVENT_NAME" == pull_request ]]; then
            source_root=.benchmark/head-source
          fi
          benchmark/baseline/run.sh \
            "$source_root" \
            .benchmark/llgo \
            .benchmark/results

      - name: Record benchmark result
        uses: xgo-dev/setup-benchmark-go-action@v1.0.6
        with:
          # workflow_run trusts the target branch configuration. Use the same
          # snapshot for pull request artifacts so selector changes take effect
          # after merge without invalidating the introducing pull request.
          config: >-
            ${{ github.event_name == 'pull_request' &&
                '.benchmark/base-benchmark.yml' ||
                '.github/llgo-benchmark.yml' }}
          benchmark-file: .benchmark/results/benchmark.txt
          baseline-benchmark-file: >-
            ${{ github.event_name == 'pull_request' &&
                steps.measure-base.outcome == 'success' &&
                '.benchmark/base-results/benchmark.txt' || '' }}
          platform-id: ${{ matrix.id }}
          platform-label: ${{ matrix.display }}

  wasm-benchmark:
    if: needs.prepare.outputs.run_code_ci == 'true'
    needs: prepare
    name: benchmark (WebAssembly)
    runs-on: ${{ fromJSON(needs.prepare.outputs.linux_large_runner) }}
    timeout-minutes: 30
    env:
      GOMAXPROCS: "2"
      LLGO_ROOT: ${{ github.workspace }}
      # Keep the existing println timing budget. Other examples are built once
      # for exact sizes; only W32 repeats reflectcall to measure bridge cost.
      LLGO_WASM_BENCH_BUILD_RUNS: "1"
      GOFLAGS: -tags=llvm23
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Check trusted WebAssembly benchmark configuration and base
        if: github.event_name == 'pull_request'
        id: wasm-merge-base
        shell: bash
        env:
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_MERGE_BASE: ${{ needs.prepare.outputs.pr_merge_base }}
        run: |
          test -n "$PR_MERGE_BASE"
          mkdir -p .benchmark
          if git show "$PR_BASE_SHA:.github/llgo-wasm-benchmark.yml" > .benchmark/wasm-base-benchmark.yml; then
            echo 'trusted-config=true' >> "$GITHUB_OUTPUT"
          else
            rm -f .benchmark/wasm-base-benchmark.yml
            echo 'trusted-config=false' >> "$GITHUB_OUTPUT"
          fi
          if git cat-file -e "$PR_MERGE_BASE:targets/emscripten.json" 2>/dev/null &&
             git cat-file -e "$PR_MERGE_BASE:targets/emscripten-memory64.json" 2>/dev/null &&
             git cat-file -e "$PR_MERGE_BASE:targets/wasi.json" 2>/dev/null; then
            echo 'compatible-base=true' >> "$GITHUB_OUTPUT"
          else
            echo 'compatible-base=false' >> "$GITHUB_OUTPUT"
          fi

      - name: Check out pull request base source
        if: github.event_name == 'pull_request'
        uses: actions/checkout@v7
        with:
          repository: ${{ github.event.pull_request.base.repo.full_name }}
          ref: ${{ needs.prepare.outputs.pr_merge_base }}
          path: .benchmark/wasm-base-source
          persist-credentials: false

      - name: Check out pull request head source
        if: github.event_name == 'pull_request'
        uses: actions/checkout@v7
        with:
          repository: ${{ github.event.pull_request.head.repo.full_name }}
          ref: ${{ needs.prepare.outputs.pr_head_sha }}
          path: .benchmark/wasm-head-source
          persist-credentials: false

      - name: Install dependencies
        uses: ./.github/actions/setup-deps
        with:
          llvm-version: 23

      - name: Set up Emscripten
        uses: emscripten-core/setup-emsdk@v15
        with:
          version: "6.0.8"

      - name: Set up Binaryen
        uses: ./.github/actions/setup-binaryen

      - name: Set up Go
        uses: ./.github/actions/setup-go

      - name: Test WebAssembly benchmark matrix and runner
        run: go test ./benchmark/wasm -count=1

      - name: Measure pull request base
        if: >-
          github.event_name == 'pull_request' &&
          steps.wasm-merge-base.outputs.compatible-base == 'true'
        id: measure-wasm-base
        shell: bash
        run: |
          benchmark/wasm/run.sh \
            .benchmark/wasm-base-source \
            .benchmark/wasm-base-llgo \
            .benchmark/wasm-base-results \
            .benchmark/wasm-head-source

      - name: Measure current revision
        shell: bash
        run: |
          source_root=.
          if [[ "$GITHUB_EVENT_NAME" == pull_request ]]; then
            source_root=.benchmark/wasm-head-source
          fi
          benchmark/wasm/run.sh \
            "$source_root" \
            .benchmark/wasm-llgo \
            .benchmark/wasm-results

      - name: Summarize pull request WebAssembly measurements
        if: github.event_name == 'pull_request'
        shell: bash
        run: |
          {
            echo '### WebAssembly build benchmark'
            echo
            if [[ '${{ steps.measure-wasm-base.outcome }}' == success ]]; then
              echo 'The base and pull request revision were measured sequentially on this runner.'
            else
              echo 'The merge-base predates the WebAssembly target profiles, so only the pull request revision was measured.'
            fi
            echo
            echo '<details><summary>Raw benchmark data</summary>'
            echo
            echo '```text'
            if [[ '${{ steps.measure-wasm-base.outcome }}' == success ]]; then
              echo 'base:'
              cat .benchmark/wasm-base-results/benchmark.txt
              echo
            fi
            echo 'pull request:'
            cat .benchmark/wasm-results/benchmark.txt
            echo '```'
            echo '</details>'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Record WebAssembly benchmark result
        # A pull request may introduce this suite before the trusted target
        # branch knows its configuration. Its paired measurements remain in
        # the job summary; artifact publication begins after the configuration
        # lands, without letting pull request code select publisher rules.
        if: >-
          github.event_name != 'pull_request' ||
          steps.wasm-merge-base.outputs.trusted-config == 'true'
        uses: xgo-dev/setup-benchmark-go-action@v1.0.6
        with:
          config: >-
            ${{ github.event_name == 'pull_request' &&
                '.benchmark/wasm-base-benchmark.yml' ||
                '.github/llgo-wasm-benchmark.yml' }}
          benchmark-file: .benchmark/wasm-results/benchmark.txt
          baseline-benchmark-file: >-
            ${{ github.event_name == 'pull_request' &&
                steps.measure-wasm-base.outcome == 'success' &&
                '.benchmark/wasm-base-results/benchmark.txt' || '' }}
          baseline-repository: >-
            ${{ github.event_name == 'pull_request' &&
                steps.measure-wasm-base.outcome == 'success' &&
                github.event.pull_request.base.repo.full_name || '' }}
          baseline-sha: >-
            ${{ github.event_name == 'pull_request' &&
                steps.measure-wasm-base.outcome == 'success' &&
                needs.prepare.outputs.pr_merge_base || '' }}
          baseline-ref: >-
            ${{ github.event_name == 'pull_request' &&
                steps.measure-wasm-base.outcome == 'success' &&
                github.event.pull_request.base.ref || '' }}
          platform-id: wasm-linux
          platform-label: WebAssembly
