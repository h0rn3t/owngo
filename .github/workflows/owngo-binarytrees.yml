name: OwnGo binary-trees

# Єдиний набір заміру треку швидкодії (owngo/bench/compare.py, S1.1):
# binary-trees 21, fannkuch-redux 12 і mandelbrot 16000 під go, llgo, llgo
# -tags owngo (-Os і -O2 -lto full), Rust і C, плюс CPU-час Go #2 під owngo на 18.
# Час не має порогу: таблиці йдуть у підсумок job, а падає job лише на
# розбіжному виводі.

on:
  push:
    branches:
      - main
  pull_request:
    branches: ["**"]
    paths:
      - "owngo/**"
      - "cl/**"
      - "ssa/**"
      - "runtime/**"
      - "internal/build/**"
      - ".github/workflows/owngo-binarytrees.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: owngo-binarytrees.yml-${{ github.event_name }}-${{ github.event.pull_request.number || (github.event_name == 'push' && github.ref == 'refs/heads/main' && 'main') || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' || (github.event_name == 'push' && github.ref == 'refs/heads/main') }}

jobs:
  binarytrees:
    name: benchmark corpus (go, llgo, owngo, Rust, C)
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      LLGO_ROOT: ${{ github.workspace }}
    steps:
      - uses: actions/checkout@v7

      - name: Install dependencies
        uses: ./.github/actions/setup-deps
        with:
          llvm-version: 23

      - name: Set up Go
        uses: ./.github/actions/setup-go

      - name: Set up Rust
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable
          cargo --version

      - name: Install C benchmark dependencies
        run: sudo apt-get install -y libapr1-dev libomp-23-dev

      - name: Compare binary-trees
        run: |
          set -o pipefail
          owngo/bench/compare-binarytrees.sh 21 3 | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Compare fannkuch-redux
        run: |
          set -o pipefail
          owngo/bench/compare-fannkuchredux.sh 12 3 | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Compare mandelbrot
        run: |
          set -o pipefail
          owngo/bench/compare-mandelbrot.sh 16000 3 | tee -a "$GITHUB_STEP_SUMMARY"
