# This workflow will build a golang project
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-go

name: Go

on:
  push:
    branches:
      - main
  pull_request:
    branches: ["**"]

concurrency:
  group: go.yml-${{ github.event_name }}-${{ github.event.pull_request.number || (github.event_name == 'push' && github.ref == 'refs/heads/main' && 'main') || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' || (github.event_name == 'push' && github.ref == 'refs/heads/main') }}

jobs:
  prepare:
    uses: ./.github/workflows/ci-prepare.yml

  ci-gate:
    name: CI gate (Go)
    needs: prepare
    if: always() && !cancelled()
    runs-on: ${{ fromJSON(needs.prepare.outputs.linux_runner || '["ubuntu-24.04"]') }}
    steps:
      - name: Verify CI preparation succeeded
        run: test "${{ needs.prepare.result }}" = "success"

  test:
    if: needs.prepare.outputs.run_code_ci == 'true'
    needs: prepare
    permissions:
      contents: read
      id-token: write
    name: test (${{ matrix.os }}, LLVM ${{ matrix.llvm }}, Go current)
    # macOS coverage alone can take 52 minutes.
    # Allow setup, emulator tests, and coverage upload to finish as well.
    # Individual Go test packages retain their existing timeout limits.
    # Native PCLN integration can relink each fixture; retain room for the
    # serial coverage suites and their upload on a cold Linux cache.
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        # Compiler and repository-tool tests use only the pinned current Go
        # release. User-code compatibility is covered by LLGo's test matrix.
        include:
          - os: macos-latest
            llvm: 23
          - os: ubuntu-latest
            llvm: 23
    runs-on: ${{ startsWith(matrix.os, 'ubuntu') && fromJSON(needs.prepare.outputs.linux_large_runner) || matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - name: Install dependencies
        uses: ./.github/actions/setup-deps
        with:
          llvm-version: ${{matrix.llvm}}

      - name: Install embedded dependencies
        uses: ./.github/actions/setup-embed-deps

      - name: Clang information
        shell: bash
        run: |
          echo "$PATH"
          which clang
          clang --version

      - name: Set up older Go for toolchain-switch regressions
        uses: ./.github/actions/setup-go
        env:
          GOTOOLCHAIN: local
        with:
          go-version: 1.21.13
          cache: 'false'

      - name: Set up Go
        uses: ./.github/actions/setup-go

      - name: Check the public Go CLI compatibility surface
        if: runner.os == 'Linux'
        run: python3 dev/check_cli_surface.py

      - name: Set up LLGo cache
        uses: ./.github/actions/setup-llgo-cache
        with:
          # PR caches are isolated from main by GitHub's cache scope. Let the
          # first run populate its merge-commit snapshot so retries can reuse it.
          build-cache-mode: readwrite
          crosscompile-cache-mode: readwrite

      - name: Install further optional dependencies for demos
        uses: ./.github/actions/setup-demo-deps

      - name: Set LLGO_ROOT
        shell: bash
        run: echo "LLGO_ROOT=$GITHUB_WORKSPACE" >> "$GITHUB_ENV"

      - name: Build
        shell: bash
        run: |
          set -euo pipefail
          go build -v ./...

      # Every host uploads coverage: OS-specific ELF and Mach-O paths
      # plus per-OS runtime shims are otherwise invisible to codecov/patch.
      - name: Test with coverage
        id: test_coverage
        env:
          # Keep all cross-target ABI goldens on Qiniu. The ordinary five
          # target architectures still run on every host.
          LLGO_TEST_EXTENDED_ABI: ${{ runner.os == 'Linux' && '1' || '0' }}
        # Compiler fixtures build and run many programs under coverage; leave
        # enough headroom for the slower native toolchains.
        shell: bash
        run: |
          set -euo pipefail

          # These jobs do not use -race. Go's default set-mode coverage records
          # the same covered statements without atomic counters in hot paths.
          go_test=(go test -json)
          main_go_test=(python .github/scripts/run_go_tests.py main "${go_test[@]}")
          if [[ "$RUNNER_OS" == Linux ]]; then
            main_go_test+=(-p=2)
          fi

          run_main_suite() {
            # Linux leaves two bounded build processes alongside at most two
            # main test packages. Each compiler has its package worker pool.
            # The direct language suite retains its own invocation and is
            # excluded from host coverage: test/ is measured by LLGo.
            go list ./... \
              | grep -v '^github.com/xgo-dev/llgo/test/go$' \
              | grep -v '^github.com/xgo-dev/llgo/cl$' \
              | grep -v '^github.com/xgo-dev/llgo/internal/build$' \
              | xargs "${main_go_test[@]}" -timeout 45m -coverprofile="coverage-main.txt" -covermode=set \
                  -coverpkg=./... -bench '^BenchmarkGo126' -benchtime=1x
          }

          run_compiler_suites() {
            # cl owns the compiler fixtures and measures calls into ssa.
            python .github/scripts/run_go_tests.py compiler "${go_test[@]}" -timeout 45m \
              -coverpkg=github.com/xgo-dev/llgo/cl,github.com/xgo-dev/llgo/ssa \
              -coverprofile="coverage-compiler.txt" -covermode=set \
              -bench '^BenchmarkGo126' -benchtime=1x ./cl
            python .github/scripts/run_go_tests.py language "${go_test[@]}" -timeout 45m ./test/go
          }

          run_build_suite() {
            # Split the longest package within this job. Each process has its
            # own source tree/cache and GOMAXPROCS=2. Discover every test,
            # verify exactly-once execution, and union statement coverage.
            build_tests=(python .github/scripts/run_build_tests.py)
            python .github/scripts/run_go_tests.py build "${build_tests[@]}"
          }

          # Overlap improved Qiniu Linux timings, but regressed on hosted macOS.
          # Keep the original serial order on other hosts until measured there.
          if [[ "$RUNNER_OS" != Linux ]]; then
            run_main_suite
            run_build_suite
            run_compiler_suites
            exit 0
          fi

          run_main_suites() {
            run_main_suite
            run_compiler_suites
          }

          # Start the longest suite immediately and overlap independent packages.
          # Separate summary files avoid interleaved Markdown; all JSON logs and
          # coverage profiles already have distinct names. Drain both processes
          # and propagate either failure before the later emulator/coverage steps.
          mkdir -p go-test-timings
          summaries=$(mktemp -d go-test-timings/summaries.XXXXXX)
          trap 'rm -rf "$summaries"' EXIT
          GITHUB_STEP_SUMMARY="$summaries/build.md" run_build_suite &
          build_pid=$!
          GITHUB_STEP_SUMMARY="$summaries/main.md" run_main_suites &
          main_pid=$!
          status=0
          wait "$main_pid" || status=$?
          wait "$build_pid" || status=$?
          if [[ -n "${GITHUB_STEP_SUMMARY:-}" ]]; then
            for report in "$summaries/main.md" "$summaries/build.md"; do
              if [[ -f "$report" ]]; then
                cat "$report" >> "$GITHUB_STEP_SUMMARY"
              fi
            done
          fi
          exit "$status"

      - name: Test traceback formatter with coverage
        shell: bash
        working-directory: runtime
        run: python ../.github/scripts/run_go_tests.py --output-dir ../go-test-timings traceback go test -json -coverprofile=../coverage-traceback.txt -covermode=set ./internal/traceback ./internal/wordmap

      - name: Test with embedded emulator env
        env:
          LLGO_EMBED_TESTS: "1"
        run: python .github/scripts/run_go_tests.py embedded go test -json -timeout 60m ./cl -run '^TestRunEmbedEmulator$'

      - name: Check std symbol coverage
        shell: bash
        run: bash doc/_readme/scripts/check_std_cover.sh

      - name: Exclude host Go coverage of test fixtures
        shell: bash
        run: |
          set -euo pipefail
          python .github/scripts/test_filter_host_coverage.py
          # Keep all host tests, but only LLGo may contribute coverage for
          # test/. Filter records, not test packages, before Codecov merges them.
          for profile in coverage-main coverage-build coverage-compiler; do
            awk -f .github/scripts/filter_host_coverage.awk \
              "$profile.txt" > "$profile-host.txt"
          done

      - name: Upload Go test timings
        if: ${{ !cancelled() && hashFiles('go-test-timings/*.jsonl') != '' }}
        uses: actions/upload-artifact@v7
        with:
          name: go-test-timings-${{ matrix.os }}
          path: go-test-timings/
          retention-days: 7

      - name: Upload coverage reports to Codecov
        uses: codecov/codecov-action@v7
        with:
          use_pypi: true
          version: "11.3.1"
          token: ${{secrets.CODECOV_TOKEN}}
          use_oidc: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository }}
          files: coverage-main-host.txt,coverage-build-host.txt,coverage-compiler-host.txt,coverage-traceback.txt
          flags: go-tests
          disable_search: true

  macos-lto-plugin:
    if: needs.prepare.outputs.run_code_ci == 'true'
    needs: prepare
    name: macOS LTO plugin
    timeout-minutes: 45
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install dependencies
        uses: ./.github/actions/setup-deps
        with:
          llvm-version: 23

      - name: Set up Go
        uses: ./.github/actions/setup-go

      - name: Set LLGO_ROOT
        run: echo "LLGO_ROOT=$GITHUB_WORKSPACE" >> "$GITHUB_ENV"

      - name: Build LTO plugin
        run: |
          set -euo pipefail
          cmake -S ltoplugin -B ltoplugin/build \
            -DLLVM_DIR="$(llvm-config --cmakedir)" \
            -DCMAKE_BUILD_TYPE=Release
          cmake --build ltoplugin/build --config Release
          test -f ltoplugin/build/LLGOLTOPlugin.dylib
          echo "LLGO_LTO_PLUGIN=$GITHUB_WORKSPACE/ltoplugin/build/LLGOLTOPlugin.dylib" >> "$GITHUB_ENV"

      - name: Test LTO plugin passes, runtime behavior, and retained symbols
        env:
          LLGO_BUILD_CACHE: "off"
        run: |
          set -euo pipefail
          go test -tags=dev -count=1 ./internal/lto ./cmd/internal/flags
          go test -tags=dev -count=1 -timeout=30m \
            -run '^(TestRunAndTestFromTestltoLTOPlugin|TestBuildAndCheckSymbolsFromTestltoLTOPlugin|TestLTOPlugin)' \
            ./cl

  dev-lto-globaldce:
    if: needs.prepare.outputs.run_code_ci == 'true'
    needs: prepare
    permissions:
      contents: read
      id-token: write
    name: Dev LTO GlobalDCE and Go Method Drop
    timeout-minutes: 60
    runs-on: ${{ fromJSON(needs.prepare.outputs.linux_large_runner) }}
    steps:
      - uses: actions/checkout@v7

      - name: Install dependencies
        uses: ./.github/actions/setup-deps
        with:
          llvm-version: 23

      - name: Set up Go
        uses: ./.github/actions/setup-go

      - name: Setup demo dependencies
        uses: ./.github/actions/setup-demo-deps

      - name: Set LLGO_ROOT
        run: echo "LLGO_ROOT=$GITHUB_WORKSPACE" >> "$GITHUB_ENV"

      - name: Build llgo with dev tag
        run: go install -tags=dev ./cmd/llgo

      - name: Build LTO plugin
        if: runner.os == 'Linux'
        run: |
          set -euo pipefail

          llvm_config="$(command -v llvm-config || command -v llvm-config-23)"
          cmake -S ltoplugin -B ltoplugin/build \
            -DLLVM_DIR="$("${llvm_config}" --cmakedir)" \
            -DCMAKE_BUILD_TYPE=Release
          cmake --build ltoplugin/build --config Release

          echo "LLGO_LTO_PLUGIN=$GITHUB_WORKSPACE/ltoplugin/build/LLGOLTOPlugin.so" >> "$GITHUB_ENV"

      - name: Run dev LTO GlobalDCE tests and demos with coverage
        run: |
          set -euo pipefail

          go test -tags=dev -timeout 30m -covermode=atomic \
            -coverprofile=coverage-dev-globaldce-unit.txt \
            -run '^TestDevLTOGlobalDCE' \
            ./ssa ./internal/build ./internal/crosscompile ./cmd/internal/flags ./internal/cabi
          go tool cover -func=coverage-dev-globaldce-unit.txt

          go test -tags=dev -timeout 30m -covermode=atomic \
            -coverpkg=github.com/xgo-dev/llgo/ssa,github.com/xgo-dev/llgo/internal/build,github.com/xgo-dev/llgo/internal/crosscompile \
            -coverprofile=coverage-dev-lto-globaldce-cl.txt \
            -run '^TestRunAndTestFromTestlto/globaldce_' \
            ./cl
          go tool cover -func=coverage-dev-lto-globaldce-cl.txt

          go test -tags=dev -timeout 30m -covermode=atomic \
            -coverpkg=github.com/xgo-dev/llgo/ssa,github.com/xgo-dev/llgo/internal/build,github.com/xgo-dev/llgo/internal/crosscompile \
            -coverprofile=coverage-dev-lto-globaldce-symbols.txt \
            -run '^TestBuildAndCheckSymbolsFromTestlto/globaldce_' \
            ./cl
          go tool cover -func=coverage-dev-lto-globaldce-symbols.txt

          go test -tags=dev -timeout 30m -covermode=atomic \
            -coverpkg=github.com/xgo-dev/llgo/ssa,github.com/xgo-dev/llgo/internal/build,github.com/xgo-dev/llgo/internal/crosscompile \
            -coverprofile=coverage-dev-lto-plugin-cl.txt \
            -run '^(TestRunAndTestFromTestltoLTOPlugin|TestBuildAndCheckSymbolsFromTestltoLTOPlugin|TestLTOPlugin)' \
            ./cl
          go tool cover -func=coverage-dev-lto-plugin-cl.txt

          LLGO_DEMO_LLGORUN_FLAGS="-lto=full -globaldce" \
            bash .github/workflows/test_demo.sh

      - name: Upload dev LTO GlobalDCE coverage reports to Codecov
        continue-on-error: true
        uses: codecov/codecov-action@v7
        with:
          use_pypi: true
          version: "11.3.1"
          token: ${{secrets.CODECOV_TOKEN}}
          use_oidc: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository }}
          files: coverage-dev-globaldce-unit.txt,coverage-dev-lto-globaldce-cl.txt,coverage-dev-lto-globaldce-symbols.txt,coverage-dev-lto-plugin-cl.txt
          flags: dev-lto-globaldce
          disable_search: true

      # Tests deletion of unreachable Go methods.
      # See https://github.com/xgo-dev/llgo/issues/1853.
      - name: Run Go method drop tests
        run: go test -tags=dev -timeout 30m -run '^TestBuildAndCheckSymbolsFromTestdrop$' ./cl

      - name: Run Go deadcode-drop demos
        run: |
          LLGO_DEMO_LLGORUN_FLAGS="-deadcodedrop" \
            bash .github/workflows/test_demo.sh

      - name: Test C-only embedded deadcode-drop builds
        run: python3 test/sizebuild/runtest.py --target=esp32c3
