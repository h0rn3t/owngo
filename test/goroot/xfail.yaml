host_skips:
  - directive: run
    case: fixedbugs/issue16016.go
    reason: the test intentionally creates enough goroutines to exhaust LLGo's one-thread-per-goroutine host limit
  - directive: run
    case: chan/goroutines.go
    reason: the test intentionally creates enough goroutines to exhaust LLGo's one-thread-per-goroutine host limit
  - directive: run
    case: chanlinear.go
    reason: the test repeatedly doubles a goroutine-per-channel workload and can exhaust LLGo's one-thread-per-goroutine host limit
  - version: go1.26
    platform: darwin/arm64
    directive: runoutput
    case: fixedbugs/bug449.go
    reason: go1.26 bug449 generated build exceeds the darwin/arm64 hosted runner resource budget
  - version: go1.26
    platform: linux/amd64
    directive: runoutput
    case: fixedbugs/bug449.go
    reason: go1.26 bug449 generated build exceeds the linux/amd64 hosted runner memory budget
timeouts:
  - platform: darwin/amd64
    directive: run
    case: recover.go
    timeout: 10m
    reason: the complete panic/recover compiler stress exceeded the 3m build budget on paired Intel macOS
  - platform: wasip1/wasm
    directive: run
    case: cmplxdivide.go
    timeout: 10m
    reason: the complete complex division table passed in 249s with time spent in LLVM WebAssembly register stackification
  - platform: darwin/amd64
    directive: run
    case: abi/uglyfib.go
    timeout: 90s
    reason: the full recursive ABI stress passed in 35-46s but exceeded 60s on a hosted Intel runner where adjacent cases also took twice as long
  - platform: js/wasm
    directive: run
    case: winbatch.go
    timeout: 6m
    reason: the full GOROOT filesystem walk took 195s on Emscripten32 locally and exceeded 240s on the paired hosted runner
  - platform: js/wasm
    directive: run
    case: fixedbugs/issue78081.go
    timeout: 6m
    reason: the 1.6 million-iteration stack and GC stress loop took 147s on a passing GoJS run and exceeded 180s on another runner
  - platform: wasip1/wasm
    directive: run
    case: fixedbugs/issue78081.go
    timeout: 6m
    reason: the full 1.6 million-iteration stack and GC stress exceeded 60s on the paired WASI runner and took 125s with the qualified Wasmer
  - platform: js/wasm
    directive: run
    case: fixedbugs/issue79186.go
    timeout: 4m
    reason: the full 51.2 million-operation RWMutex loop passed in 55.7s on GoJS but exceeded 2m on a paired Emscripten64 runner
  - platform: js/wasm
    directive: runoutput
    case: fixedbugs/issue5162.go
    timeout: 7m
    reason: building the 768 generated array-comparison functions exhausted the 5m budget while Go 1.26 and Go 1.27 shards shared a loaded GoJS runner
  - platform: darwin/arm64
    directive: run
    case: fixedbugs/issue79186.go
    timeout: 90s
    reason: the 51.2 million-operation RWMutex stress loop needs load-dependent runtime slack
  - platform: linux/amd64
    directive: run
    case: fixedbugs/issue79186.go
    timeout: 90s
    reason: the 51.2 million-operation RWMutex stress loop needs load-dependent runtime slack
  - version: go1.26
    platform: darwin/arm64
    directive: run
    case: fixedbugs/issue19658.go
    timeout: 2m
    reason: the test launches 19 nested go run commands and needs load-dependent runtime slack
  - version: go1.26
    platform: linux/amd64
    directive: run
    case: abi/uglyfib.go
    timeout: 1m
    reason: uglyfib runs close to the default timeout on loaded linux/amd64 runners
  - platform: darwin/amd64
    directive: runoutput
    case: rangegen.go
    timeout: 10m
    reason: both paired Go versions exceeded the default 3m generated-build timeout for the 6.4 MB compiler torture test on Intel macOS
  - platform: js/wasm
    directive: runoutput
    case: rangegen.go
    timeout: 15m
    reason: the large generated range-over-func program exceeds the default 3m build timeout on Emscripten; retain the complete test with a bounded compiler budget
  - platform: wasip1/wasm
    directive: runoutput
    case: rangegen.go
    timeout: 15m
    reason: the full generated range-over-func program exceeded the default 3m build budget on the paired WASI runner
  - platform: darwin/arm64
    directive: runoutput
    case: rangegen.go
    timeout: 20m
    reason: rangegen generates a large compiler torture test; paired Go 1.26/1.27 builds exceeded the default 3m build timeout on darwin/arm64 CI
  - platform: linux/amd64
    directive: runoutput
    case: rangegen.go
    timeout: 10m
    reason: rangegen generates a 6.4 MB compiler torture test; allow bounded build time while its 3 GiB heap target stays under the 4 GiB host guard
  - version: go1.26
    platform: linux/amd64
    directive: run
    case: nosplit.go
    timeout: 2m
    reason: nosplit run runs past the default timeout on linux/amd64
flakes:
xfails:
  - directive: errorcheck
    case: fixedbugs/issue4776.go
    reason: llgo parser uses a different missing-package-clause diagnostic
  - directive: errorcheck
    case: fixedbugs/issue4405.go
    reason: llgo parser recovery emits additional malformed-statement diagnostics
  - directive: errorcheck
    case: fixedbugs/issue13266.go
    reason: llgo parser uses a different malformed-package-clause diagnostic
  - version: go1.26
    directive: errorcheck
    case: fixedbugs/issue20789.go
    reason: llgo parser does not emit the expected malformed-name diagnostic
  - directive: errorcheck
    case: fixedbugs/bug050.go
    reason: llgo parser emits an additional malformed-declaration diagnostic
  - directive: errorcheck
    case: bombad.go
    reason: llgo parser recovery emits additional byte-order-mark diagnostics

  - directive: run
    case: heapsampling.go
    reason: LLGo does not currently report the heap-profile samples required by this runtime test
  - platform: J32-GoJS
    directive: run
    case: init1.go
    reason: the conservative linear collector retains enough loop-temporary pointers to grow memory past this Go allocator threshold
  - platform: J32-Emscripten
    directive: run
    case: init1.go
    reason: the conservative linear collector retains enough loop-temporary pointers to grow memory past this Go allocator threshold
  - platform: js/wasm
    directive: errorcheck
    case: fixedbugs/issue5089.go
    reason: LLGo does not yet diagnose a method declaration on a non-local type
