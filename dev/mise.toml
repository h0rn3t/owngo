min_version = "2026.10.7"

[tool_config]
locked = true

[tools]
go = "{{ read_file(path='../.go-version') | trim }}"
"conda:llvmdev" = "23.1.4"
"conda:clangxx" = "23.1.4"
"conda:lld" = "23.1.4"
"conda:pkg-config" = "0.29.2"
"conda:bdw-gc" = "8.2.12"
"conda:libffi" = "3.7.0"
"conda:openssl" = "3.6.4"
"conda:zlib" = "1.3.2"
"conda:sqlite" = "3.53.4"
"conda:libuv" = "1.52.1"

[vars]
native_libraries = "bdw-gc,libffi,openssl,zlib,sqlite,libuv"

[env]
GOFLAGS = "-tags=byollvm"
GOTOOLCHAIN = "local"
CGO_ENABLED = "1"
LLGO_ROOT = "{{ config_root | dirname }}"
LLGO_LLVM_PREFIX = { value = "{{ tools.llvmdev.path }}", tools = true }
LLGO_CLANG_PREFIX = { value = "{{ tools.clangxx.path }}", tools = true }
LLGO_LLD_PREFIX = { value = "{{ tools.lld.path }}", tools = true }
LLGO_PKG_CONFIG_PREFIX = { value = "{{ tools['pkg-config'].path }}", tools = true }
PKG_CONFIG = { value = "\"{{ config_root }}/conda-tools/pkg-config\"", tools = true }
PKG_CONFIG_ALLOW_SYSTEM_CFLAGS = "1"
PKG_CONFIG_ALLOW_SYSTEM_LIBS = "1"
# LLGo needs explicit flags, including paths also listed in CPATH/LIBRARY_PATH.
# Use the full compiler prefix: clangxx is a metapackage, whose actual
# executables are dependencies and are not exposed by mise's conda launchers.
_.path = { path = [
  "{{ config_root }}/conda-tools",
  "{{ env.LLGO_CLANG_PREFIX }}/{{ os(linux='bin', macos='bin') }}",
  "{{ env.LLGO_LLVM_PREFIX }}/{{ os(linux='bin', macos='bin') }}",
  "{{ env.LLGO_LLD_PREFIX }}/{{ os(linux='bin', macos='bin') }}",
  "{% for name in vars.native_libraries | split(pat=',') %}{{ tools[name].path }}/{{ os(linux='bin', macos='bin') }}{% if not loop.last %}{{ os(linux=':', macos=':') }}{% endif %}{% endfor %}",
], tools = true }
CPATH = { value = "{% for name in vars.native_libraries | split(pat=',') %}{{ tools[name].path }}/{{ os(linux='include', macos='include') }}{{ os(linux=':', macos=':') }}{% endfor %}${CPATH:-}", tools = true }
LIBRARY_PATH = { value = "{% for name in vars.native_libraries | split(pat=',') %}{{ tools[name].path }}/{{ os(linux='lib', macos='lib') }}{{ os(linux=':', macos=':') }}{% endfor %}${LIBRARY_PATH:-}", tools = true }
PKG_CONFIG_PATH = { value = "{% for name in vars.native_libraries | split(pat=',') %}{{ tools[name].path }}/{{ os(linux='lib/pkgconfig', macos='lib/pkgconfig') }}{{ os(linux=':', macos=':') }}{% endfor %}${PKG_CONFIG_PATH:-}", tools = true }
LD_LIBRARY_PATH = { value = "{% if os() == 'linux' %}{{ env.LLGO_CLANG_PREFIX }}/lib:{{ env.LLGO_LLVM_PREFIX }}/lib:{{ env.LIBRARY_PATH }}:${LD_LIBRARY_PATH:-}{% else %}${LD_LIBRARY_PATH:-}{% endif %}", tools = true }
CC = { value = "{% if os() == 'linux' %}\"{{ config_root }}/conda-tools/clang\"{% else %}clang{% endif %}", tools = true }
CXX = { value = "{% if os() == 'linux' %}\"{{ config_root }}/conda-tools/clang++\"{% else %}clang++{% endif %}", tools = true }
LLVM_CONFIG = "llvm-config"
CGO_CPPFLAGS = { value = "{{ exec(command='bash devenv_unix_flags.sh cppflags') }}", tools = true }
CGO_CXXFLAGS = "-std=c++17"
CGO_LDFLAGS = { value = "{{ exec(command='bash devenv_unix_flags.sh ldflags') }}", tools = true }
